<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty — SLTSC Academy</title><link rel="stylesheet" href="assets/css/style.css?v=4.0"><link rel="stylesheet" href="assets/css/pages.css?v=4.0"></head><body><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div><main id="main-content"><section class="inner-banner"><img src="https://images.unsplash.com/photo-1758270704021-361c165d68fd?auto=format&fit=crop&w=1920&q=80" alt="Teacher lecturing a bright classroom"><div class="container"><p class="breadcrumb">Home / Faculty</p><span class="eyebrow">People behind the pathway</span><h1>Meet the faculty</h1></div></section><section class="section"><div class="container"><div class="section-heading"><div><span class="eyebrow">Faculty directory</span><h2>Guidance that keeps learning human.</h2></div><label>Filter by school <select id="faculty-filter"><option value="all">All schools</option><option value="networking">Networking</option><option value="cybersecurity">Cybersecurity</option><option value="software">Software</option></select></label></div><div class="faculty-grid" id="faculty-grid"></div></div></section></main><div id="site-footer"></div><script src="assets/js/data.js?v=4.0"></script><script src="assets/js/main.js?v=4.0"></script><script src="assets/js/site-fixes.js?v=4.0"></script><script>document.addEventListener('DOMContentLoaded',()=>{const grid=document.querySelector('#faculty-grid'),filter=document.querySelector('#faculty-filter');function render(){grid.innerHTML=window.SLTSC.faculty.filter(f=>filter.value==='all'||f.school===filter.value||f.school==='all').map(f=>`<article class="faculty-card"><img src="${f.image.url}" alt="${f.image.alt}"><div><h3>${f.name}</h3><p>${f.role}</p><span class="demo-badge">${f.name.includes('Yasiru')?'Founder & Lead Instructor':'Demo faculty'}</span></div></article>`).join('')}filter.addEventListener('change',render);render()})</script></body></html>
